<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Assignment Maker</title>
    <style>
      :root {
        --bg: #eef1f4;
        --card: #fff;
        --ink: #1b2430;
        --mute: #5c6773;
        --acc: #0f6b6b;
        --red: #c62828;
        --redbg: #fdecec;
        --line: #d5dbe1;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141a21;
          --card: #1d252e;
          --ink: #e8edf2;
          --mute: #9aa7b4;
          --acc: #4fc3c3;
          --red: #ff6b6b;
          --redbg: #3a1d1f;
          --line: #34404c;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          16px/1.4 system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        background: var(--bg);
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        z-index: 5;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      h2 {
        font-size: 20px;
        margin: 0;
      }
      h3 {
        margin: 0 0 4px;
      }
      nav {
        display: flex;
        gap: 6px;
      }
      nav button {
        flex: 1;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 12px;
      }
      button,
      select,
      input,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        border: 1px solid var(--line);
        background: var(--card);
        border-radius: 8px;
        padding: 9px 12px;
        cursor: pointer;
      }
      button.on,
      button.pri {
        background: var(--acc);
        color: #fff;
        border-color: var(--acc);
      }
      button.del {
        color: var(--red);
      }
      input,
      select,
      textarea {
        border: 1px solid var(--line);
        background: var(--card);
        border-radius: 8px;
        padding: 8px;
        max-width: 100%;
      }
      textarea {
        width: 100%;
        min-height: 90px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
        margin: 12px 0;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: space-between;
      }
      .sm {
        margin: 8px 0;
        justify-content: flex-start;
      }
      .bar {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .hint,
      small,
      .lbl {
        color: var(--mute);
        font-size: 14px;
      }
      .lbl {
        margin: 10px 0 4px;
      }
      label {
        display: block;
        margin-top: 8px;
      }
      label input {
        width: 100%;
        margin-top: 4px;
      }
      label.n {
        margin: 0;
      }
      label.n input {
        width: 64px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .chip {
        border: 1px solid var(--line);
        border-radius: 99px;
        padding: 4px 10px;
        font-size: 14px;
        background: var(--bg);
      }
      .chip button {
        border: 0;
        background: none;
        padding: 0 0 0 4px;
        color: var(--red);
      }
      .tog.on {
        background: var(--acc);
        color: #fff;
        border-color: var(--acc);
      }
      .tog.on2 {
        background: #b36b00;
        color: #fff;
        border-color: #b36b00;
      }
      .res {
        margin-top: 12px;
        border-top: 1px solid var(--line);
        padding-top: 8px;
      }
      .slot {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        width: 100%;
        text-align: left;
        margin: 4px 0;
      }
      .slot b {
        text-align: right;
      }
      .slot.empty {
        background: var(--redbg);
        border: 2px solid var(--red);
        color: var(--red);
      }
      .warn {
        background: var(--redbg);
        color: var(--red);
        border: 2px solid var(--red);
        border-radius: 8px;
        padding: 8px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      .sup {
        margin: 8px 0;
        font-size: 15px;
      }
      .ov {
        position: fixed;
        inset: 0;
        background: #0009;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        z-index: 10;
      }
      .sheet {
        background: var(--card);
        width: 100%;
        max-width: 640px;
        max-height: 85vh;
        overflow: auto;
        border-radius: 16px 16px 0 0;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .list {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .list button {
        text-align: left;
      }
      .list .bad {
        color: var(--mute);
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        background: var(--ink);
        color: var(--bg);
        padding: 10px 16px;
        border-radius: 99px;
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
        z-index: 20;
      }
      #toast.show {
        opacity: 1;
      }
      pre {
        white-space: pre-wrap;
        margin: 6px 0;
        font: inherit;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Assignment Maker</h1>
      <nav>
        <button data-a="tab" data-v="gen">Generate</button
        ><button data-a="tab" data-v="mem">Members</button
        ><button data-a="tab" data-v="task">Tasks</button
        ><button data-a="tab" data-v="hist">History</button>
      </nav>
    </header>
    <main id="app"></main>
    <div id="toast"></div>
    <script>
      const KEY = "assigner_v1",
        MON = [
          "Jan",
          "Feb",
          "Mar",
          "Apr",
          "May",
          "Jun",
          "Jul",
          "Aug",
          "Sep",
          "Oct",
          "Nov",
          "Dec",
        ],
        WD = [
          "Sunday",
          "Monday",
          "Tuesday",
          "Wednesday",
          "Thursday",
          "Friday",
          "Saturday",
        ];
      const T0 = [
        ["Entrance Attendant", 2, 1],
        ["Parking Attendant", 1],
        ["Auditorium Attendant/will open the donation box", 2, 1],
        ["Audio", 1],
        ["Audio Assistant/charging batteries", 1],
        ["Video", 1],
        ["Video Assistant/charging tablet", 1],
        ["Mic server", 2],
        ["VC Attendant", 1],
        ["Stage Attendant (Podium, Mic ng Reader, Tablet)", 1],
      ];
      const $ = (id) => document.getElementById(id),
        pad = (n) => String(n).padStart(2, "0");
      const iso = (d) =>
        d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
      const dt = (s) => new Date(s + "T00:00:00"),
        hd = (s) =>
          MON[dt(s).getMonth()] +
          " " +
          dt(s).getDate() +
          " (" +
          WD[dt(s).getDay()] +
          ")";
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const nz = (s) => s.replace(/\s+/g, " ").trim().toLowerCase();
      const shuf = (a) => {
        a = a.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      };
      function dm() {
        const d = new Date();
        while (d.getDay() !== 4) d.setDate(d.getDate() + 1);
        const a = iso(d);
        d.setDate(d.getDate() + 3);
        return [a, iso(d)].map((x) => ({
          date: x,
          head: hd(x),
          edited: false,
          un: [],
          slots: null,
        }));
      }
      function dflt() {
        return {
          members: [],
          tasks: T0.map((t, i) => ({
            id: "t" + i,
            label: t[0],
            n: t[1],
            ok: [],
            ok2: [],
            cat: !!t[2],
          })),
          history: [],
          meetings: dm(),
        };
      }
      let S,
        tab = "gen",
        P = null;
      try {
        S = JSON.parse(localStorage.getItem(KEY));
      } catch (e) {}
      if (!S || !S.members) S = dflt();
      S.tasks.forEach((t) => {
        if (!t.ok2) t.ok2 = [];
      });
      S.meetings.forEach((m) => {
        if (!m.edited) m.head = hd(m.date);
      });
      S.history.forEach((h) => (h.head = hd(h.date)));
      if (S.meetings.every((m) => m.date < iso(new Date()))) S.meetings = dm();
      function save() {
        try {
          localStorage.setItem(KEY, JSON.stringify(S));
        } catch (e) {}
      }
      function toast(t) {
        const e = $("toast");
        e.textContent = t;
        e.classList.add("show");
        setTimeout(() => e.classList.remove("show"), 1800);
      }
      const task = (id) => S.tasks.find((t) => t.id === id);
      const okOf = (t, s) => (t.cat && s.g === 1 ? t.ok2 : t.ok),
        lab = (t, s) =>
          t.label + (t.cat ? (s.g === 1 ? " (MS/Publisher)" : " (Elder)") : "");

      function prevOf(i) {
        const d = S.meetings[i].date;
        let best = null;
        S.history.forEach((h) => {
          if (
            h.date < d &&
            !S.meetings.some(
              (m, j) => j !== i && m.slots && m.date === h.date,
            ) &&
            (!best || h.date > best.date)
          )
            best = h;
        });
        S.meetings.forEach((m, j) => {
          if (j !== i && m.slots && m.date < d && (!best || m.date > best.date))
            best = m;
        });
        const map = {};
        if (best)
          best.slots.forEach((s) => {
            if (s.name) map[s.name] = s.taskId;
          });
        return map;
      }
      function gen(i) {
        const m = S.meetings[i],
          prev = prevOf(i),
          un = new Set(m.un),
          slots = [];
        S.tasks.forEach((t) => {
          if (t.cat) {
            const a = [
              { taskId: t.id, g: 0, name: null },
              { taskId: t.id, g: 1, name: null },
            ];
            if (Math.random() < 0.5) a.reverse();
            slots.push(...a);
          } else
            for (let k = 0; k < t.n; k++)
              slots.push({ taskId: t.id, name: null });
        });
        const cand = slots.map((s) => {
          const t = task(s.taskId);
          return S.members.filter(
            (p) => okOf(t, s).includes(p) && !un.has(p) && prev[p] !== t.id,
          );
        });
        let best = null;
        for (let r = 0; r < 40; r++) {
          const mt = {},
            lists = cand.map((c) =>
              c
                .map((p) => [p, (prev[p] ? 0.5 : 0) + Math.random()])
                .sort((a, b) => a[1] - b[1])
                .map((x) => x[0]),
            );
          const tr = (k, seen) => {
            for (const p of lists[k]) {
              if (seen.has(p)) continue;
              seen.add(p);
              if (mt[p] === undefined || tr(mt[p], seen)) {
                mt[p] = k;
                return true;
              }
            }
            return false;
          };
          shuf(slots.map((_, k) => k)).forEach((k) => tr(k, new Set()));
          const ps = Object.keys(mt),
            f = ps.length,
            rep = ps.filter((p) => prev[p]).length;
          if (!best || f > best.f || (f === best.f && rep < best.r))
            best = { f, r: rep, mt };
        }
        Object.entries(best.mt).forEach(([p, k]) => (slots[k].name = p));
        m.slots = slots;
      }
      function warnEmpty(from) {
        const out = [];
        for (let i = from; i < S.meetings.length; i++) {
          const m = S.meetings[i];
          if (!m.slots) continue;
          const e = m.slots
            .filter((s) => !s.name)
            .map((s) => lab(task(s.taskId), s));
          if (e.length)
            out.push(
              WD[dt(m.date).getDay()] +
                " " +
                hd(m.date) +
                ":\n- " +
                e.join("\n- "),
            );
        }
        if (out.length)
          alert(
            "⚠ Some slots could not be filled:\n\n" +
              out.join("\n\n") +
              "\n\nThey are marked red. Tap one to fill it manually.",
          );
      }
      function why(i, k, p) {
        const m = S.meetings[i],
          s = m.slots[k],
          t = task(s.taskId),
          pr = prevOf(i);
        if (!okOf(t, s).includes(p)) return "not on this slot's list";
        if (m.un.includes(p)) return "unavailable";
        if (pr[p] === t.id) return "same task last time";
        if (m.slots.some((x, j) => j !== k && x.name === p))
          return "already has a task";
        return "";
      }
      function replace(i, k, clearIfNone) {
        const s = S.meetings[i].slots[k],
          c = S.members.filter((p) => p !== s.name && !why(i, k, p));
        if (!c.length) {
          if (clearIfNone) {
            s.name = null;
            s.over = false;
          }
          alert(
            "No one else can take this slot" +
              (clearIfNone
                ? ". It is marked red. Choose someone manually."
                : "."),
          );
          return;
        }
        s.name = c[Math.floor(Math.random() * c.length)];
        s.over = false;
      }
      const supportOf = (m) => {
        const u = new Set(m.slots.map((s) => s.name));
        return S.members.filter((p) => !u.has(p) && !m.un.includes(p));
      };
      function text(i) {
        const m = S.meetings[i],
          L = [];
        if (m.head) L.push(m.head);
        m.slots.forEach((s) => {
          const t = task(s.taskId);
          if (t) L.push(t.label + ": " + (s.name || "(EMPTY)"));
        });
        const sp = supportOf(m);
        L.push("Support: " + (sp.length ? sp.join(", ") : "none"));
        return L.join("\n\n");
      }
      function saveHist(i) {
        const m = S.meetings[i];
        S.history = S.history.filter((h) => h.date !== m.date);
        S.history.push({
          date: m.date,
          head: m.head,
          slots: m.slots
            .filter((s) => s.name)
            .map((s) => ({ taskId: s.taskId, name: s.name })),
        });
        S.history.sort((a, b) => (a.date < b.date ? 1 : -1));
        S.history = S.history.slice(0, 60);
      }
      async function copy(i) {
        const e = S.meetings[i].slots.filter((s) => !s.name).length;
        if (
          e &&
          !confirm(
            e + " slot(s) are still empty and will show (EMPTY). Copy anyway?",
          )
        )
          return;
        const t = text(i);
        try {
          await navigator.clipboard.writeText(t);
        } catch (_) {
          const a = document.createElement("textarea");
          a.value = t;
          document.body.appendChild(a);
          a.select();
          document.execCommand("copy");
          a.remove();
        }
        saveHist(i);
        save();
        toast("Copied and saved to history");
      }
      function rename(o, n) {
        n = n.trim().replace(/\s+/g, " ");
        if (!n || n === o) return;
        if (S.members.some((x) => nz(x) === nz(n))) {
          alert("That name already exists.");
          return;
        }
        const f = (a) => a.map((x) => (x === o ? n : x));
        S.members = f(S.members);
        S.tasks.forEach((t) => {
          t.ok = f(t.ok);
          t.ok2 = f(t.ok2);
        });
        S.meetings.forEach((m) => {
          m.un = f(m.un);
          if (m.slots)
            m.slots.forEach((s) => {
              if (s.name === o) s.name = n;
            });
        });
        S.history.forEach((h) =>
          h.slots.forEach((s) => {
            if (s.name === o) s.name = n;
          }),
        );
      }
      function addMembers(txt) {
        txt
          .split(/[\n,]+/)
          .map((x) => x.trim().replace(/\s+/g, " "))
          .filter(Boolean)
          .forEach((n) => {
            if (!S.members.some((x) => nz(x) === nz(n))) S.members.push(n);
          });
      }
      function parsePaste(txt) {
        const slots = [],
          bad = [];
        txt.split("\n").forEach((l) => {
          const c = l.indexOf(":");
          if (c < 0) return;
          const lab = nz(l.slice(0, c)),
            nm = l
              .slice(c + 1)
              .trim()
              .replace(/\s+/g, " ");
          if (!nm || lab === "support") return;
          const t = S.tasks.find((x) => nz(x.label) === lab);
          if (!t) {
            bad.push(l.trim());
            return;
          }
          slots.push({
            taskId: t.id,
            name: S.members.find((x) => nz(x) === nz(nm)) || nm,
          });
        });
        return { slots, bad };
      }

      function vGen() {
        let h = `<div class="bar"><button class="pri" data-a="gen">Generate both</button><span class="hint">${S.members.length ? "" : "Add members first, then tick who can do each task."}</span></div>`;
        S.meetings.forEach((m, i) => {
          h += `<section class="card"><div class="row"><h2>${WD[dt(m.date).getDay()]}</h2><input type="date" value="${m.date}" data-f="date" data-i="${i}"></div>
  <label>Heading<input value="${esc(m.head)}" data-f="head" data-i="${i}"></label>
  <div class="lbl">Not available (has another task, or absent)</div><div class="chips">${m.un.map((p) => `<span class="chip">${esc(p)}<button data-a="rmun" data-i="${i}" data-p="${esc(p)}">×</button></span>`).join("")}
  <select data-f="unadd" data-i="${i}"><option value="">+ Add person</option>${S.members
    .filter((p) => !m.un.includes(p))
    .map((p) => `<option>${esc(p)}</option>`)
    .join("")}</select></div>`;
          if (m.slots) {
            const e = m.slots.filter((s) => !s.name).length;
            h += `<div class="res">${e ? `<div class="warn">⚠ ${e} slot${e > 1 ? "s" : ""} still empty. Tap a red row to fill it.</div>` : ""}`;
            m.slots.forEach((s, k) => {
              const t = task(s.taskId);
              if (!t) return;
              h += `<button class="slot${s.name ? "" : " empty"}" data-a="pick" data-i="${i}" data-k="${k}"><span>${esc(t.label)}${t.cat ? ` <small>(${s.g === 1 ? "MS/Publisher" : "Elder"})</small>` : ""}</span><b>${s.name ? esc(s.name) + (s.over ? " ⚠" : "") : "NEEDS SOMEONE"}</b></button>`;
            });
            const sp = supportOf(m);
            h += `<div class="sup"><b>Support:</b> ${sp.length ? esc(sp.join(", ")) : "none"}</div>
   <div class="bar"><button class="pri" data-a="copy" data-i="${i}">Copy</button><button data-a="reroll" data-i="${i}">${i < S.meetings.length - 1 ? "Re-roll this + next" : "Re-roll this one"}</button></div></div>`;
          }
          h += "</section>";
        });
        return h;
      }
      function vMem() {
        return `<section class="card"><div class="lbl">Add members (one name per line)</div><textarea id="nm" placeholder="Heron D.&#10;Anthony G."></textarea><p><button class="pri" data-a="addmem">Add</button></p></section>
 <section class="card"><div class="lbl">${S.members.length} members. Edit a name or remove it.</div>${S.members.map((p) => `<div class="row sm"><input value="${esc(p)}" data-f="ren" data-p="${esc(p)}"><button class="del" data-a="rmmem" data-p="${esc(p)}">Remove</button></div>`).join("")}</section>`;
      }
      function vTask() {
        return (
          S.tasks
            .map(
              (
                t,
                x,
              ) => `<section class="card"><div class="row"><input value="${esc(t.label)}" data-f="tlabel" data-t="${x}" style="flex:1">${t.cat ? "" : `<label class="n">Slots <input type="number" min="1" max="9" value="${t.n}" data-f="tn" data-t="${x}"></label>`}</div>
 <div class="row sm"><button data-a="tup" data-t="${x}">↑</button><button data-a="tdown" data-t="${x}">↓</button>${t.cat ? "" : `<button data-a="eall" data-t="${x}">All</button>`}<button data-a="enone" data-t="${x}">Clear</button><button class="${t.cat ? "on" : ""}" data-a="tcat" data-t="${x}">1 Elder + 1 MS/Publisher</button><button class="del" data-a="tdel" data-t="${x}">Delete</button></div>
 <div class="lbl">${t.cat ? `Tap a name to cycle: Elder, then MS/Publisher, then none. (${t.ok.length} Elders, ${t.ok2.length} MS/Publishers)` : `Who can do this (${t.ok.length})`}</div>
 <div class="chips">${
   S.members
     .map((p) => {
       const c = t.ok.includes(p) ? 1 : t.ok2.includes(p) ? 2 : 0;
       return t.cat
         ? `<button class="chip tog${c === 1 ? " on" : c === 2 ? " on2" : ""}" data-a="cyc" data-t="${x}" data-p="${esc(p)}">${esc(p)}${c === 1 ? " · Elder" : c === 2 ? " · MS/Pub" : ""}</button>`
         : `<button class="chip tog${c ? " on" : ""}" data-a="elig" data-t="${x}" data-p="${esc(p)}">${esc(p)}</button>`;
     })
     .join("") || '<i class="hint">Add members first.</i>'
 }</div></section>`,
            )
            .join("") +
          `<section class="card"><div class="row"><input id="ntask" placeholder="New task name" style="flex:1"><button class="pri" data-a="addtask">Add task</button></div></section>`
        );
      }
      function vHist() {
        return (
          `<section class="card"><b>Add a past meeting</b><p class="hint">Paste last meeting's message so the app knows who did what. Lines like "Audio: Ronald C."</p>
 <input type="date" id="hdate" value="${iso(new Date())}"><textarea id="htxt"></textarea><p><button class="pri" data-a="hadd">Save past meeting</button></p></section>` +
          S.history
            .map(
              (h) =>
                `<section class="card"><div class="row"><b>${esc(h.head || h.date)} <small>${h.date}</small></b><button class="del" data-a="hdel" data-d="${h.date}">Delete</button></div><pre>${h.slots.map((s) => esc((task(s.taskId) || { label: "?" }).label) + ": " + esc(s.name)).join("\n")}</pre></section>`,
            )
            .join("") +
          `<section class="card"><b>Backup</b><p class="hint">Data lives only in this browser. Use backup to move it to another device.</p><div class="bar"><button data-a="export">Download backup</button><input type="file" accept=".json" data-f="imp"></div></section>`
        );
      }
      function vPick() {
        if (!P) return "";
        const m = S.meetings[P.i],
          s = m.slots[P.k],
          t = task(s.taskId);
        const rows = S.members
          .filter((p) => p !== s.name)
          .map((p) => [p, why(P.i, P.k, p)])
          .sort((a, b) => (a[1] ? 1 : 0) - (b[1] ? 1 : 0));
        return `<div class="ov" data-a="closepick"><div class="sheet" onclick="event.stopPropagation()"><h3>${esc(lab(t, s))}</h3><small>${s.name ? "Now: " + esc(s.name) : "Empty slot"}</small>
 <button class="pri" data-a="rand">Random replacement</button>${s.name ? `<button data-a="absent">${esc(s.name)} is absent. Replace.</button><button data-a="clear">Leave empty</button>` : ""}
 <div class="lbl">Or choose someone</div><div class="list">${rows.map(([p, r]) => `<button class="${r ? "bad" : ""}" data-a="choose" data-p="${esc(p)}">${esc(p)}${r ? ` <small>(${r})</small>` : ""}</button>`).join("")}</div><button data-a="closepick">Close</button></div></div>`;
      }
      function render() {
        $("app").innerHTML =
          { gen: vGen, mem: vMem, task: vTask, hist: vHist }[tab]() + vPick();
        document
          .querySelectorAll("nav button")
          .forEach((b) => b.classList.toggle("on", b.dataset.v === tab));
        save();
      }

      document.addEventListener("click", (e) => {
        const b = e.target.closest("[data-a]");
        if (!b) return;
        const a = b.dataset.a,
          i = +b.dataset.i,
          k = +b.dataset.k,
          x = +b.dataset.t,
          p = b.dataset.p;
        if (a === "tab") {
          tab = b.dataset.v;
          P = null;
        } else if (a === "gen") {
          gen(0);
          gen(1);
          render();
          warnEmpty(0);
          return;
        } else if (a === "reroll") {
          for (let j = i; j < S.meetings.length; j++) gen(j);
          render();
          warnEmpty(i);
          return;
        } else if (a === "copy") {
          copy(i);
          return;
        } else if (a === "rmun")
          S.meetings[i].un = S.meetings[i].un.filter((y) => y !== p);
        else if (a === "pick") P = { i, k };
        else if (a === "closepick") P = null;
        else if (a === "rand") {
          replace(P.i, P.k, false);
          P = null;
        } else if (a === "absent") {
          const m = S.meetings[P.i];
          m.un.push(m.slots[P.k].name);
          replace(P.i, P.k, true);
          P = null;
        } else if (a === "clear") {
          const s = S.meetings[P.i].slots[P.k];
          s.name = null;
          s.over = false;
          P = null;
        } else if (a === "choose") {
          const m = S.meetings[P.i],
            s = m.slots[P.k],
            r = why(P.i, P.k, p);
          m.slots.forEach((y) => {
            if (y.name === p) y.name = null;
          });
          s.name = p;
          s.over = !!r;
          P = null;
        } else if (a === "addmem") {
          addMembers($("nm").value);
        } else if (a === "rmmem") {
          if (!confirm("Remove " + p + "?")) return;
          S.members = S.members.filter((y) => y !== p);
          S.tasks.forEach((t) => {
            t.ok = t.ok.filter((y) => y !== p);
            t.ok2 = t.ok2.filter((y) => y !== p);
          });
          S.meetings.forEach((m) => (m.un = m.un.filter((y) => y !== p)));
        } else if (a === "elig") {
          const t = S.tasks[x];
          t.ok = t.ok.includes(p)
            ? t.ok.filter((y) => y !== p)
            : t.ok.concat(p);
        } else if (a === "cyc") {
          const t = S.tasks[x],
            c = t.ok.includes(p) ? 1 : t.ok2.includes(p) ? 2 : 0;
          t.ok = t.ok.filter((y) => y !== p);
          t.ok2 = t.ok2.filter((y) => y !== p);
          if (c === 0) t.ok.push(p);
          else if (c === 1) t.ok2.push(p);
        } else if (a === "tcat") {
          const t = S.tasks[x];
          if (
            t.ok.length + t.ok2.length &&
            !confirm(
              "This clears the current list of who can do this task. Continue?",
            )
          )
            return;
          t.cat = !t.cat;
          t.ok = [];
          t.ok2 = [];
        } else if (a === "eall") S.tasks[x].ok = S.members.slice();
        else if (a === "enone") {
          S.tasks[x].ok = [];
          S.tasks[x].ok2 = [];
        } else if (a === "tup" && x > 0)
          [S.tasks[x - 1], S.tasks[x]] = [S.tasks[x], S.tasks[x - 1]];
        else if (a === "tdown" && x < S.tasks.length - 1)
          [S.tasks[x + 1], S.tasks[x]] = [S.tasks[x], S.tasks[x + 1]];
        else if (a === "tdel") {
          if (!confirm("Delete this task?")) return;
          S.tasks.splice(x, 1);
        } else if (a === "addtask") {
          const v = $("ntask").value.trim();
          if (v)
            S.tasks.push({
              id: "t" + Date.now(),
              label: v,
              n: 1,
              ok: [],
              ok2: [],
              cat: false,
            });
        } else if (a === "hdel")
          S.history = S.history.filter((h) => h.date !== b.dataset.d);
        else if (a === "hadd") {
          const r = parsePaste($("htxt").value),
            d = $("hdate").value;
          if (!d || !r.slots.length) {
            alert('Pick a date and paste lines like "Audio: Ronald C."');
            return;
          }
          S.history = S.history.filter((h) => h.date !== d);
          S.history.push({ date: d, head: hd(d), slots: r.slots });
          S.history.sort((u, v) => (u.date < v.date ? 1 : -1));
          alert(
            "Saved " +
              r.slots.length +
              " assignments." +
              (r.bad.length
                ? "\n\nNot recognised (task name does not match):\n" +
                  r.bad.join("\n")
                : ""),
          );
        } else if (a === "export") {
          const u = URL.createObjectURL(
              new Blob([JSON.stringify(S)], { type: "application/json" }),
            ),
            l = document.createElement("a");
          l.href = u;
          l.download = "assignment-maker-backup.json";
          l.click();
          return;
        }
        render();
      });
      document.addEventListener("change", (e) => {
        const f = e.target.dataset.f;
        if (!f) return;
        const v = e.target.value,
          i = +e.target.dataset.i,
          x = +e.target.dataset.t;
        if (f === "date" && v) {
          const m = S.meetings[i];
          m.date = v;
          if (!m.edited) m.head = hd(v);
        } else if (f === "head") {
          S.meetings[i].head = v;
          S.meetings[i].edited = true;
        } else if (f === "unadd") {
          if (v) S.meetings[i].un.push(v);
        } else if (f === "ren") rename(e.target.dataset.p, v);
        else if (f === "tlabel") {
          if (v.trim()) S.tasks[x].label = v.trim();
        } else if (f === "tn") S.tasks[x].n = Math.max(1, Math.min(9, +v || 1));
        else if (f === "imp") {
          const r = new FileReader();
          r.onload = () => {
            try {
              const o = JSON.parse(r.result);
              if (!o.members || !o.tasks) throw 0;
              S = o;
              render();
              toast("Backup restored");
            } catch (_) {
              alert("That file is not a valid backup.");
            }
          };
          r.readAsText(e.target.files[0]);
          return;
        }
        render();
      });
      render();
    </script>
  </body>
</html>
