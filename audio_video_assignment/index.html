<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Assignment Maker</title>
    <meta name="color-scheme" content="light dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Public+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var u = JSON.parse(localStorage.getItem("assigner_ui")) || {},
            m = u.mode || "auto",
            h = document.documentElement;
          if (m === "auto")
            m = matchMedia("(prefers-color-scheme:dark)").matches
              ? "dark"
              : "light";
          h.dataset.theme = u.theme || "cobalt";
          h.dataset.mode = m;
          h.dataset.layout = u.layout || "bold";
        } catch (e) {}
      })();
    </script>
    <style>
      :root,
      [data-theme="cobalt"] {
        --acc: #2438f0;
        --aci: #fff;
      }
      [data-theme="pine"] {
        --acc: #0b6b4b;
        --aci: #fff;
      }
      [data-theme="rose"] {
        --acc: #b4234f;
        --aci: #fff;
      }
      :root {
        --bg: #fff;
        --sf: #f3f5f8;
        --ink: #0e1116;
        --mu: #546070;
        --ln: #d3d9e1;
        --am: #a35200;
        --ami: #fff;
        --red: #c62828;
        --rbg: #fdecec;
        --ovc: rgba(14, 17, 22, 0.55);
        --r: 14px;
        --bw: 2px;
        --hw: 800;
        --nw: 700;
        --pb: var(--acc);
        --pi: var(--aci);
      }
      html[data-mode="dark"] {
        --bg: #0f1620;
        --sf: #172130;
        --ink: #e8edf3;
        --mu: #a3afbf;
        --ln: #2c3a4d;
        --am: #f0b35a;
        --ami: #0f1620;
        --red: #ff8f8f;
        --rbg: #3b2029;
        --ovc: rgba(5, 8, 12, 0.7);
        color-scheme: dark;
      }
      html[data-mode="dark"][data-theme="cobalt"],
      [data-mode="dark"] [data-theme="cobalt"] {
        --acc: #97a6ff;
        --aci: #0f1620;
      }
      html[data-mode="dark"][data-theme="pine"],
      [data-mode="dark"] [data-theme="pine"] {
        --acc: #6fd3a8;
        --aci: #0f1620;
      }
      html[data-mode="dark"][data-theme="rose"],
      [data-mode="dark"] [data-theme="rose"] {
        --acc: #f59ab6;
        --aci: #0f1620;
      }
      html[data-layout="clean"] {
        --r: 6px;
        --bw: 1px;
        --hw: 600;
        --nw: 600;
        --pb: transparent;
        --pi: var(--ink);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          400 16px/1.45 "Public Sans",
          Arial,
          sans-serif;
      }
      h1,
      h2,
      h3 {
        font-family: "Bricolage Grotesque", Arial, sans-serif;
        font-weight: var(--hw);
        margin: 0;
      }
      h2 {
        font-size: 28px;
        line-height: 1.1;
        margin-bottom: 4px;
      }
      h3 {
        font-size: 18px;
      }
      .i {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 16px;
        background: var(--bg);
        border-bottom: var(--bw) solid var(--ln);
      }
      .t {
        font:
          var(--hw) 20px "Bricolage Grotesque",
          Arial,
          sans-serif;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .t::before {
        content: "";
        width: 12px;
        height: 12px;
        background: var(--acc);
        border-radius: 3px;
      }
      nav {
        display: flex;
        gap: 4px;
        margin-left: auto;
      }
      button,
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 44px;
        padding: 0 16px;
        border: var(--bw) solid var(--ln);
        border-radius: var(--r);
        background: var(--bg);
        color: var(--ink);
        font:
          600 15px "Public Sans",
          Arial,
          sans-serif;
        cursor: pointer;
        transition:
          background-color 0.18s,
          color 0.18s,
          border-color 0.18s,
          box-shadow 0.18s,
          transform 0.18s;
      }
      button:active {
        transform: scale(0.97);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        pointer-events: none;
      }
      .pri {
        background: var(--acc);
        border-color: var(--acc);
        color: var(--aci);
      }
      .dng {
        color: var(--red);
      }
      .ix {
        width: 44px;
        padding: 0;
      }
      .ld::after {
        content: "";
        width: 14px;
        height: 14px;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      :focus-visible {
        outline: 3px solid var(--acc);
        outline-offset: 2px;
      }
      @media (hover: hover) {
        button:hover {
          border-color: var(--ink);
        }
        .pri:hover {
          box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.3);
        }
        .tb:hover {
          background: var(--sf);
        }
        .ln:hover {
          background: var(--sf);
        }
        input:hover,
        select:hover,
        textarea:hover {
          border-color: var(--mu);
        }
      }
      .tb {
        border: 0;
        background: none;
        color: var(--mu);
      }
      .tb.on {
        background: var(--sf);
        color: var(--acc);
      }
      .tset {
        display: none;
      }
      input,
      select,
      textarea {
        min-height: 44px;
        max-width: 100%;
        padding: 8px 12px;
        border: var(--bw) solid var(--ln);
        border-radius: var(--r);
        background: var(--bg);
        color: var(--ink);
        font: inherit;
        transition:
          border-color 0.18s,
          box-shadow 0.18s;
      }
      textarea {
        width: 100%;
        min-height: 110px;
      }
      ::placeholder {
        color: var(--mu);
      }
      label {
        display: block;
        margin-top: 16px;
        font-weight: 600;
        font-size: 14px;
        color: var(--mu);
      }
      label input {
        width: 100%;
        margin-top: 6px;
        color: var(--ink);
      }
      label.n {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0;
      }
      label.n input {
        width: 72px;
        margin: 0;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 16px 16px 110px;
      }
      .top {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        padding-bottom: 8px;
      }
      .hint {
        color: var(--mu);
        font-size: 14px;
        margin: 4px 0 12px;
      }
      .blk {
        padding: 20px 0;
        border-bottom: 1px solid var(--ln);
      }
      .blk h3 {
        margin-bottom: 8px;
      }
      .em {
        padding: 32px 0;
        max-width: 420px;
      }
      .em.sm {
        padding: 12px 0;
      }
      .em h2,
      .em h3 {
        margin-bottom: 8px;
      }
      .em p {
        color: var(--mu);
        margin: 0 0 16px;
      }
      .mt {
        display: grid;
        gap: 20px;
        padding: 24px 0;
        border-bottom: var(--bw) solid var(--ln);
      }
      .date {
        background: var(--pb);
        color: var(--pi);
        border: var(--bw) solid var(--acc);
        border-radius: var(--r);
        padding-bottom: 16px;
      }
      .dd {
        padding: 16px;
      }
      .dd b {
        display: block;
        font:
          var(--hw) 44px/1 "Bricolage Grotesque",
          Arial,
          sans-serif;
      }
      .dd span {
        font-size: 18px;
        font-weight: 600;
      }
      .date input {
        margin: 0 16px;
        width: calc(100% - 32px);
      }
      .ctl h3 {
        margin-top: 20px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .chip {
        min-height: 44px;
        padding: 0 14px;
        font-size: 14px;
        background: var(--sf);
      }
      .chip.e {
        background: var(--acc);
        border-color: var(--acc);
        color: var(--aci);
      }
      .chip.m {
        background: var(--am);
        border-color: var(--am);
        color: var(--ami);
      }
      .ln {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        min-height: 60px;
        padding: 8px 8px 8px 0;
        border: 0;
        border-bottom: 1px solid var(--ln);
        border-radius: 0;
        background: none;
        text-align: left;
        color: var(--ink);
        font-weight: 400;
      }
      .ln .mk {
        align-self: stretch;
        width: 4px;
        border-radius: 2px;
        background: var(--ln);
        flex: none;
      }
      .ln.e .mk {
        background: var(--acc);
      }
      .ln.m .mk {
        background: var(--am);
      }
      .lb {
        font-size: 14px;
        color: var(--mu);
        max-width: 52%;
      }
      .lb small {
        display: block;
        font-size: 12px;
        font-weight: 700;
      }
      .lb small.e {
        color: var(--acc);
      }
      .lb small.m {
        color: var(--am);
      }
      .dots {
        flex: 1;
        min-width: 10px;
        border-bottom: 2px dotted var(--ln);
        transform: translateY(4px);
      }
      .nm {
        font:
          var(--nw) 22px/1.1 "Bricolage Grotesque",
          Arial,
          sans-serif;
        text-align: right;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .nm.sm {
        font-size: 16px;
        max-width: 60%;
      }
      .ovr {
        color: var(--am);
        display: inline-flex;
      }
      .ln.empty {
        background: var(--rbg);
        border: 2px solid var(--red);
        border-radius: var(--r);
        margin: 6px 0;
      }
      .ln.empty .mk {
        background: var(--red);
        width: 6px;
      }
      .ln.empty .nm {
        color: var(--red);
        font-size: 16px;
      }
      .warn {
        display: flex;
        gap: 10px;
        align-items: center;
        background: var(--rbg);
        color: var(--red);
        border: 2px solid var(--red);
        border-radius: var(--r);
        padding: 10px 12px;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .acts {
        position: sticky;
        bottom: calc(76px + env(safe-area-inset-bottom));
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        padding: 12px 0;
        background: var(--bg);
        border-top: 1px solid var(--ln);
        margin-top: 8px;
      }
      .sk {
        display: flex;
        align-items: center;
        min-height: 60px;
        border-bottom: 1px solid var(--ln);
      }
      .sk i {
        display: block;
        height: 14px;
        border-radius: 7px;
        background: var(--sf);
        animation: pl 0.9s ease-in-out infinite alternate;
      }
      @keyframes pl {
        to {
          opacity: 0.4;
        }
      }
      .rv {
        animation: in 0.22s both;
        animation-delay: var(--d);
      }
      @keyframes in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }
      .mr,
      .tr,
      .hr {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
      }
      .mr input,
      .tr > input {
        flex: 1;
        min-width: 0;
      }
      .hr {
        justify-content: space-between;
      }
      .tools {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 12px 0;
      }
      pre {
        white-space: pre-wrap;
        margin: 0;
        font:
          14px/1.6 "Public Sans",
          Arial,
          sans-serif;
        color: var(--mu);
      }
      .seg {
        display: inline-flex;
        border: var(--bw) solid var(--ln);
        border-radius: var(--r);
        overflow: hidden;
      }
      .seg button {
        border: 0;
        border-radius: 0;
      }
      .seg button[aria-pressed="true"] {
        background: var(--acc);
        color: var(--aci);
      }
      .sws {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .sw {
        flex: 1;
        min-width: 130px;
        flex-direction: column;
        align-items: stretch;
        padding: 12px;
        gap: 10px;
        text-align: left;
      }
      .sw[aria-pressed="true"] {
        border-color: var(--acc);
        box-shadow: 0 0 0 2px var(--acc);
      }
      .pv {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 10px;
        background: var(--sf);
        border-radius: var(--r);
      }
      .pv i {
        width: 4px;
        height: 24px;
        border-radius: 2px;
        background: var(--acc);
      }
      .pv i.a {
        background: var(--am);
      }
      .pv b {
        font:
          var(--nw) 16px "Bricolage Grotesque",
          Arial,
          sans-serif;
        color: var(--ink);
      }
      .ov {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: var(--ovc);
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }
      .sheet {
        width: 100%;
        max-width: 520px;
        max-height: 86vh;
        overflow: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        background: var(--bg);
        border: var(--bw) solid var(--ln);
        border-radius: var(--r) var(--r) 0 0;
      }
      .sheet small {
        color: var(--mu);
      }
      .list {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .list button {
        justify-content: flex-start;
        text-align: left;
        border-color: transparent;
      }
      .list .bad {
        color: var(--mu);
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: calc(92px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        background: var(--ink);
        color: var(--bg);
        padding: 12px 18px;
        border-radius: var(--r);
        font-weight: 600;
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
        z-index: 30;
      }
      #toast.show {
        opacity: 1;
      }
      @media (max-width: 859px) {
        .gear {
          display: none;
        }
        .tset {
          display: flex;
        }
        nav {
          position: fixed;
          left: 0;
          right: 0;
          bottom: 0;
          z-index: 6;
          margin: 0;
          padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
          background: var(--bg);
          border-top: var(--bw) solid var(--ln);
        }
        nav .tb {
          flex: 1;
          flex-direction: column;
          gap: 2px;
          padding: 4px 0;
          font-size: 12px;
        }
      }
      @media (min-width: 860px) {
        main {
          padding: 24px 32px 48px;
        }
        .mt {
          grid-template-columns: 340px 1fr;
          gap: 48px;
        }
        .acts {
          bottom: 0;
        }
        #toast {
          bottom: 32px;
        }
        .ov {
          align-items: center;
        }
        .sheet {
          border-radius: var(--r);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }

      .mts {
        display: block;
      }
      .lt {
        display: inline;
      }
      @media (max-width: 859px) {
        .ln {
          display: grid;
          grid-template-columns: 4px auto 1fr auto;
          grid-template-areas: "mk lt lt lt" "mk tg dots nm";
          column-gap: 10px;
          row-gap: 2px;
          align-items: center;
          padding: 8px 4px 8px 0;
        }
        .lb {
          display: contents;
        }
        .mk {
          grid-area: mk;
        }
        .lt {
          grid-area: lt;
          font-size: 14px;
          color: var(--mu);
        }
        .lb small {
          grid-area: tg;
        }
        .dots {
          grid-area: dots;
          align-self: end;
          transform: none;
          margin-bottom: 7px;
        }
        .nm {
          grid-area: nm;
        }
        .ln.sp {
          grid-template-columns: 4px 1fr;
          grid-template-areas: "mk lt" "mk nm";
        }
        .sp .dots {
          display: none;
        }
        .sp .nm {
          justify-content: flex-start;
          text-align: left;
          max-width: none;
          font-size: 16px;
        }
      }
      @media (min-width: 1200px) {
        .mts {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 48px;
          align-items: start;
        }
        .mt {
          grid-template-columns: 1fr;
          gap: 16px;
          border-bottom: 0;
          padding-top: 24px;
        }
        .ctl {
          display: grid;
          grid-template-columns: auto 1fr;
          gap: 12px 16px;
          align-items: end;
          padding-bottom: 12px;
          border-bottom: 1px solid var(--ln);
        }
        .ctl > label {
          margin: 0;
        }
        .ctl h3,
        .ctl .hint,
        .ctl .chips {
          grid-column: 1/-1;
        }
        .ctl h3 {
          font-size: 15px;
          margin: 4px 0 0;
        }
        .ctl .hint {
          margin: 0 0 4px;
        }
        .date {
          display: flex;
          align-items: center;
          gap: 14px;
          padding: 8px 14px;
          background: var(--sf);
          background: color-mix(in srgb, var(--acc) 12%, var(--bg));
          color: var(--ink);
        }
        .dd {
          padding: 0;
          display: flex;
          align-items: baseline;
          gap: 8px;
        }
        .dd b {
          font-size: 26px;
        }
        .dd span {
          font-size: 14px;
          color: var(--mu);
        }
        .date input {
          margin: 0;
          width: 150px;
        }
      }

      .rwp {
        margin-top: 20px;
        padding-top: 14px;
        border-top: var(--bw) solid var(--ln);
      }
      .rwh {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }
      .rwf,
      .rwo {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        font-weight: 700;
      }
      .rwf {
        color: var(--red);
      }
      .rwo {
        color: var(--acc);
      }
      .rwr {
        display: grid;
        grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1fr);
        gap: 12px;
        align-items: center;
        min-height: 44px;
        padding: 6px 8px 6px 0;
        border-bottom: 1px solid var(--ln);
      }
      .rwt {
        font-size: 14px;
        color: var(--mu);
      }
      .rwa,
      .rwb {
        font:
          var(--nw) 16px "Bricolage Grotesque",
          Arial,
          sans-serif;
      }
      .rwr small {
        display: block;
        font:
          500 12px "Public Sans",
          Arial,
          sans-serif;
        color: var(--mu);
      }
      .rwc {
        border-bottom: var(--bw) solid var(--ink);
        min-height: 0;
      }
      .rwc .rwa,
      .rwc .rwb {
        font:
          600 14px "Public Sans",
          Arial,
          sans-serif;
      }
      .rwr.bad {
        background: var(--rbg);
        box-shadow: inset 4px 0 0 var(--red);
        padding-left: 10px;
      }
      .rwr.bad .rwb,
      .rwa.bad,
      .rwb.bad {
        color: var(--red);
      }
      .rwb em {
        display: flex;
        align-items: center;
        gap: 4px;
        font:
          600 12px "Public Sans",
          Arial,
          sans-serif;
        font-style: normal;
        color: var(--red);
      }
      .rwtg {
        display: none;
        margin-bottom: 8px;
      }
      @media (max-width: 859px) {
        .rwtg {
          display: inline-flex;
        }
        .rwr {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        }
        .rwp[data-v="this"] .rwa,
        .rwp[data-v="prev"] .rwb {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="i-gen" viewBox="0 0 24 24">
          <path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5" />
        </symbol>
        <symbol id="i-mem" viewBox="0 0 24 24">
          <circle cx="9" cy="8" r="3.5" />
          <path
            d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2.2.6 3.5 2.6 3.5 5"
          />
        </symbol>
        <symbol id="i-task" viewBox="0 0 24 24">
          <path d="M9 6h12M9 12h12M9 18h12M3.5 6h.01M3.5 12h.01M3.5 18h.01" />
        </symbol>
        <symbol id="i-hist" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 7v5l3 2" />
        </symbol>
        <symbol id="i-set" viewBox="0 0 24 24">
          <path
            d="M12.2 2h-.4a2 2 0 0 0-2 2v.2a2 2 0 0 1-1 1.7l-.4.3a2 2 0 0 1-2 0l-.2-.1a2 2 0 0 0-2.7.7l-.2.4a2 2 0 0 0 .7 2.7l.2.1a2 2 0 0 1 1 1.7v.5a2 2 0 0 1-1 1.7l-.2.1a2 2 0 0 0-.7 2.7l.2.4a2 2 0 0 0 2.7.7l.2-.1a2 2 0 0 1 2 0l.4.3a2 2 0 0 1 1 1.7V20a2 2 0 0 0 2 2h.4a2 2 0 0 0 2-2v-.2a2 2 0 0 1 1-1.7l.4-.3a2 2 0 0 1 2 0l.2.1a2 2 0 0 0 2.7-.7l.2-.4a2 2 0 0 0-.7-2.7l-.2-.1a2 2 0 0 1-1-1.7v-.5a2 2 0 0 1 1-1.7l.2-.1a2 2 0 0 0 .7-2.7l-.2-.4a2 2 0 0 0-2.7-.7l-.2.1a2 2 0 0 1-2 0l-.4-.3a2 2 0 0 1-1-1.7V4a2 2 0 0 0-2-2z"
          />
          <circle cx="12" cy="12" r="3" />

        <symbol id="i-plus" viewBox="0 0 24 24">

          <path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" />

        <symbol id="i-check" viewBox="0 0 24 24">
          <path d="M5 12.5 10 17.5 19 7" />
        </symbol>
        <symbol id="i-alert" viewBox="0 0 24 24">
          <path d="M12 3 2.5 20h19z" />
          <path d="M12 10v4.5M12 17.5h.01" />

        <symbol id="i-up" viewBox="0 0 24 24">
          <path d="M12 19V5M6 11l6-6 6 6" />

    </svg>
    <header>
      <span class="t">Assignment Maker</span>
      <nav id="tabs">
        <button class="tb" data-a="tab" data-v="gen">
          <svg class="i"><use href="#i-gen" /></svg
          ><span>Generate</span></button
        ><button class="tb" data-a="tab" data-v="mem">
          <svg class="i"><use href="#i-mem" /></svg><span>Members</span></button
        ><button class="tb" data-a="tab" data-v="task">
          <svg class="i"><use href="#i-task" /></svg><span>Tasks</span></button
        ><button class="tb" data-a="tab" data-v="hist">
          <svg class="i"><use href="#i-hist" /></svg
          ><span>History</span></button
        ><button class="tb tset" data-a="tab" data-v="set">
          <svg class="i"><use href="#i-set" /></svg><span>Settings</span>
        </button>
      </nav>
      <button
        class="tb gear ix"
        data-a="tab"
        data-v="set"
        aria-label="Settings"
      >
        <svg class="i"><use href="#i-set" /></svg>
      </button>
    </header>
    <main id="app"></main>
    <div id="toast" role="status"></div>
    <script>
      const KEY = "assigner_v1",
        MON = [
          "Jan",
          "Feb",
          "Mar",
          "Apr",
          "May",
          "Jun",
          "Jul",
          "Aug",
          "Sep",
          "Oct",
          "Nov",
          "Dec",
        ],
        WD = [
          "Sunday",
          "Monday",
          "Tuesday",
          "Wednesday",
          "Thursday",
          "Friday",
          "Saturday",
        ];
      const T0 = [
        ["Entrance Attendant", 2, 1],
        ["Parking Attendant", 1],
        ["Auditorium Attendant/will open the donation box", 2, 1],
        ["Audio", 1],
        ["Audio Assistant/charging batteries", 1],
        ["Video", 1],
        ["Video Assistant/charging tablet", 1],
        ["Mic server", 2],
        ["VC Attendant", 1],
        ["Stage Attendant (Podium, Mic ng Reader, Tablet)", 1],
      ];
      const $ = (id) => document.getElementById(id),
        pad = (n) => String(n).padStart(2, "0");
      const iso = (d) =>
        d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
      const dt = (s) => new Date(s + "T00:00:00"),
        hd = (s) =>
          MON[dt(s).getMonth()] +
          " " +
          dt(s).getDate() +
          " (" +
          WD[dt(s).getDay()] +
          ")";
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const nz = (s) => s.replace(/\s+/g, " ").trim().toLowerCase();
      const shuf = (a) => {
        a = a.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      };
      function dm() {
        const d = new Date();
        while (d.getDay() !== 4) d.setDate(d.getDate() + 1);
        const a = iso(d);
        d.setDate(d.getDate() + 3);
        return [a, iso(d)].map((x) => ({
          date: x,
          head: hd(x),
          edited: false,
          un: [],
          slots: null,
        }));
      }
      function dflt() {
        return {
          members: [],
          tasks: T0.map((t, i) => ({
            id: "t" + i,
            label: t[0],
            n: t[1],
            ok: [],
            ok2: [],
            cat: !!t[2],
          })),
          history: [],
          meetings: dm(),
        };
      }
      let S,
        tab = "gen",
        P = null,
        busy = false,
        reveal = false,
        copied = -1,
        rvView = {};
      try {
        S = JSON.parse(localStorage.getItem(KEY));
      } catch (e) {}
      if (!S || !S.members) S = dflt();
      S.tasks.forEach((t) => {
        if (!t.ok2) t.ok2 = [];
      });
      S.meetings.forEach((m) => {
        if (!m.edited) m.head = hd(m.date);
      });
      S.history.forEach((h) => (h.head = hd(h.date)));
      if (S.meetings.every((m) => m.date < iso(new Date()))) S.meetings = dm();
      function save() {
        try {
          localStorage.setItem(KEY, JSON.stringify(S));
        } catch (e) {}
      }
      function toast(t) {
        const e = $("toast");
        e.textContent = t;
        e.classList.add("show");
        setTimeout(() => e.classList.remove("show"), 1800);
      }
      const task = (id) => S.tasks.find((t) => t.id === id);
      const okOf = (t, s) => (t.cat && s.g === 1 ? t.ok2 : t.ok),
        lab = (t, s) =>
          t.label + (t.cat ? (s.g === 1 ? " (MS/Publisher)" : " (Elder)") : "");

      function prevOf(i) {
        const d = S.meetings[i].date;
        let best = null;
        S.history.forEach((h) => {
          if (
            h.date < d &&
            !S.meetings.some(
              (m, j) => j !== i && m.slots && m.date === h.date,
            ) &&
            (!best || h.date > best.date)
          )
            best = h;
        });
        S.meetings.forEach((m, j) => {
          if (j !== i && m.slots && m.date < d && (!best || m.date > best.date))
            best = m;
        });
        const map = {};
        if (best)
          best.slots.forEach((s) => {
            if (s.name) map[s.name] = s.taskId;
          });
        return map;
      }
      function gen(i) {
        const m = S.meetings[i],
          prev = prevOf(i),
          un = new Set(m.un),
          slots = [];
        S.tasks.forEach((t) => {
          if (t.cat) {
            const a = [
              { taskId: t.id, g: 0, name: null },
              { taskId: t.id, g: 1, name: null },
            ];
            if (Math.random() < 0.5) a.reverse();
            slots.push(...a);
          } else
            for (let k = 0; k < t.n; k++)
              slots.push({ taskId: t.id, name: null });
        });
        const cand = slots.map((s) => {
          const t = task(s.taskId);
          return S.members.filter(
            (p) => okOf(t, s).includes(p) && !un.has(p) && prev[p] !== t.id,
          );
        });
        let best = null;
        for (let r = 0; r < 40; r++) {
          const mt = {},
            lists = cand.map((c) =>
              c
                .map((p) => [p, (prev[p] ? 0.5 : 0) + Math.random()])
                .sort((a, b) => a[1] - b[1])
                .map((x) => x[0]),
            );
          const tr = (k, seen) => {
            for (const p of lists[k]) {
              if (seen.has(p)) continue;
              seen.add(p);
              if (mt[p] === undefined || tr(mt[p], seen)) {
                mt[p] = k;
                return true;
              }
            }
            return false;
          };
          shuf(slots.map((_, k) => k)).forEach((k) => tr(k, new Set()));
          const ps = Object.keys(mt),
            f = ps.length,
            rep = ps.filter((p) => prev[p]).length;
          if (!best || f > best.f || (f === best.f && rep < best.r))
            best = { f, r: rep, mt };
        }
        Object.entries(best.mt).forEach(([p, k]) => (slots[k].name = p));
        m.slots = slots;
      }
      function warnEmpty(from) {
        const out = [];
        for (let i = from; i < S.meetings.length; i++) {
          const m = S.meetings[i];
          if (!m.slots) continue;
          const e = m.slots
            .filter((s) => !s.name)
            .map((s) => lab(task(s.taskId), s));
          if (e.length)
            out.push(
              WD[dt(m.date).getDay()] +
                " " +
                hd(m.date) +
                ":\n- " +
                e.join("\n- "),
            );
        }
        if (out.length)
          alert(
            "⚠ Some slots could not be filled:\n\n" +
              out.join("\n\n") +
              "\n\nThey are marked red. Tap one to fill it manually.",
          );
      }
      function why(i, k, p) {
        const m = S.meetings[i],
          s = m.slots[k],
          t = task(s.taskId),
          pr = prevOf(i);
        if (!okOf(t, s).includes(p)) return "not on this slot's list";
        if (m.un.includes(p)) return "unavailable";
        if (pr[p] === t.id) return "same task last time";
        if (m.slots.some((x, j) => j !== k && x.name === p))
          return "already has a task";
        return "";
      }
      function replace(i, k, clearIfNone) {
        const s = S.meetings[i].slots[k],
          c = S.members.filter((p) => p !== s.name && !why(i, k, p));
        if (!c.length) {
          if (clearIfNone) {
            s.name = null;
            s.over = false;
          }
          alert(
            "No one else can take this slot" +
              (clearIfNone
                ? ". It is marked red. Choose someone manually."
                : "."),
          );
          return;
        }
        s.name = c[Math.floor(Math.random() * c.length)];
        s.over = false;
      }
      const supportOf = (m) => {
        const u = new Set(m.slots.map((s) => s.name));
        return S.members.filter((p) => !u.has(p) && !m.un.includes(p));
      };
      function text(i) {
        const m = S.meetings[i],
          L = [];
        if (m.head) L.push(m.head);
        m.slots.forEach((s) => {
          const t = task(s.taskId);
          if (t) L.push(t.label + ": " + (s.name || "(EMPTY)"));
        });
        const sp = supportOf(m);
        L.push("Support: " + (sp.length ? sp.join(", ") : "none"));
        return L.join("\n\n");
      }
      function saveHist(i) {
        const m = S.meetings[i];
        S.history = S.history.filter((h) => h.date !== m.date);
        S.history.push({
          date: m.date,
          head: m.head,
          slots: m.slots
            .filter((s) => s.name)
            .map((s) => ({ taskId: s.taskId, name: s.name })),
        });
        S.history.sort((a, b) => (a.date < b.date ? 1 : -1));
        S.history = S.history.slice(0, 60);
      }
      async function copy(i) {
        const e = S.meetings[i].slots.filter((s) => !s.name).length;
        if (
          e &&
          !confirm(
            e + " slot(s) are still empty and will show (EMPTY). Copy anyway?",
          )
        )
          return;
        const t = text(i);
        try {
          await navigator.clipboard.writeText(t);
        } catch (_) {
          const a = document.createElement("textarea");
          a.value = t;
          document.body.appendChild(a);
          a.select();
          document.execCommand("copy");
          a.remove();
        }
        toast(isSaved(i) ? "Copied" : "Copied. Not saved to History yet");
        copied = i;
        render();
        setTimeout(() => {
          copied = -1;
          render();
        }, 2000);
      }
      function rename(o, n) {
        n = n.trim().replace(/\s+/g, " ");
        if (!n || n === o) return;
        if (S.members.some((x) => nz(x) === nz(n))) {
          alert("That name already exists.");
          return;
        }
        const f = (a) => a.map((x) => (x === o ? n : x));
        S.members = f(S.members);
        S.tasks.forEach((t) => {
          t.ok = f(t.ok);
          t.ok2 = f(t.ok2);
        });
        S.meetings.forEach((m) => {
          m.un = f(m.un);
          if (m.slots)
            m.slots.forEach((s) => {
              if (s.name === o) s.name = n;
            });
        });
        S.history.forEach((h) =>
          h.slots.forEach((s) => {
            if (s.name === o) s.name = n;
          }),
        );
      }
      function addMembers(txt) {
        txt
          .split(/[\n,]+/)
          .map((x) => x.trim().replace(/\s+/g, " "))
          .filter(Boolean)
          .forEach((n) => {
            if (!S.members.some((x) => nz(x) === nz(n))) S.members.push(n);
          });
      }
      function parsePaste(txt) {
        const slots = [],
          bad = [];
        txt.split("\n").forEach((l) => {
          const c = l.indexOf(":");
          if (c < 0) return;
          const lab = nz(l.slice(0, c)),
            nm = l
              .slice(c + 1)
              .trim()
              .replace(/\s+/g, " ");
          if (!nm || lab === "support") return;
          const t = S.tasks.find((x) => nz(x.label) === lab);
          if (!t) {
            bad.push(l.trim());
            return;
          }
          slots.push({
            taskId: t.id,
            name: S.members.find((x) => nz(x) === nz(nm)) || nm,
          });
        });
        return { slots, bad };
      }

      const ic = (n) =>
        `<svg class="i" aria-hidden="true"><use href="#i-${n}"/></svg>`;
      let U = Object.assign(
        { theme: "cobalt", mode: "auto", layout: "bold" },
        (() => {
          try {
            return JSON.parse(localStorage.getItem("assigner_ui"));
          } catch (e) {
            return null;
          }
        })(),
      );
      const mq = matchMedia("(prefers-color-scheme:dark)");
      function applyUI() {
        const h = document.documentElement;
        h.dataset.theme = U.theme;
        h.dataset.layout = U.layout;
        h.dataset.mode =
          U.mode === "auto" ? (mq.matches ? "dark" : "light") : U.mode;
        try {
          localStorage.setItem("assigner_ui", JSON.stringify(U));
        } catch (e) {}
      }
      mq.addEventListener("change", () => {
        if (U.mode === "auto") applyUI();
      });
      applyUI();
      function run(from) {
        if (busy) return;
        busy = true;
        render();
        setTimeout(() => {
          for (let j = from; j < S.meetings.length; j++) gen(j);
          busy = false;
          reveal = true;
          render();
          reveal = false;
          warnEmpty(from);
        }, 380);
      }
      const sk = () =>
        [62, 48, 70, 40, 58, 52, 66, 44, 60, 50]
          .map((w) => `<div class="sk"><i style="width:${w}%"></i></div>`)
          .join("");
      function prevMeet(i) {
        const d = S.meetings[i].date;
        let b = null;
        S.history.forEach((h) => {
          if (
            h.date < d &&
            !S.meetings.some(
              (m, j) => j !== i && m.slots && m.date === h.date,
            ) &&
            (!b || h.date > b.date)
          )
            b = h;
        });
        S.meetings.forEach((m, j) => {
          if (j !== i && m.slots && m.date < d && (!b || m.date > b.date))
            b = m;
        });
        return b;
      }
      function isSaved(i) {
        const m = S.meetings[i];
        if (!m.slots) return false;
        const h = S.history.find((x) => x.date === m.date);
        if (!h) return false;
        return (
          JSON.stringify(
            m.slots.filter((s) => s.name).map((s) => [s.taskId, s.name]),
          ) === JSON.stringify(h.slots.map((s) => [s.taskId, s.name]))
        );
      }
      function review(m, i) {
        const pm = prevMeet(i),
          v = rvView[i] || "this";
        if (!pm)
          return `<div class="rwp"><div class="rwh"><h3>Review</h3></div><p class="hint">No previous meeting found in History, so nothing to compare. Add one in the History tab.</p><button data-a="tab" data-v="hist">${ic("hist")}Open History</button></div>`;
        const pn = {};
        pm.slots.forEach((x) => {
          if (x.name) (pn[x.taskId] = pn[x.taskId] || []).push(x.name);
        });
        const used = {};
        let flags = 0;
        const rows = m.slots
          .map((x) => {
            const t = task(x.taskId);
            if (!t) return "";
            const k = (used[x.taskId] = (used[x.taskId] || 0) + 1),
              prev = (pn[x.taskId] || [])[k - 1] || "";
            const same = !!x.name && (pn[x.taskId] || []).includes(x.name);
            if (same) flags++;
            const pSame =
              !!prev &&
              m.slots.some((y) => y.taskId === x.taskId && y.name === prev);
            return `<div class="rwr${same ? " bad" : ""}"><span class="rwt">${esc(lab(t, x))}</span><span class="rwa${pSame ? " bad" : ""}">${prev ? esc(prev) : "None"}</span><span class="rwb${x.name ? "" : " bad"}">${x.name ? esc(x.name) : "Needs someone"}${same ? `<em>${ic("alert")}same as last meeting</em>` : ""}</span></div>`;
          })
          .join("");
        return `<div class="rwp" data-v="${v}"><div class="rwh"><h3>Review against last meeting</h3>${flags ? `<span class="rwf">${ic("alert")}${flags} repeat${flags > 1 ? "s" : ""}</span>` : `<span class="rwo">${ic("check")}No repeats</span>`}</div>
 <div class="seg rwtg" role="group">${[
   ["prev", "Previous"],
   ["this", "This"],
 ]
   .map(
     ([a, l]) =>
       `<button data-a="rvv" data-i="${i}" data-val="${a}" aria-pressed="${v === a}">${l}</button>`,
   )
   .join("")}</div>
 <div class="rwr rwc"><span class="rwt"></span><span class="rwa">Previous meeting<small>${esc(pm.head || pm.date)}</small></span><span class="rwb">This meeting<small>${esc(m.head || m.date)}</small></span></div>${rows}</div>`;
      }
      function roster(m, i) {
        const e = m.slots.filter((s) => !s.name).length;
        let n = 0;
        let h = e
          ? `<div class="warn" role="alert">${ic("alert")}<span>${e} slot${e > 1 ? "s" : ""} still empty. Tap a red row to fill it.</span></div>`
          : "";
        m.slots.forEach((s, k) => {
          const t = task(s.taskId);
          if (!t) return;
          const rc = t.cat ? (s.g === 1 ? "m" : "e") : "";
          h += `<button class="ln ${rc}${s.name ? "" : " empty"}${reveal ? " rv" : ""}" style="--d:${n++ * 35}ms" data-a="pick" data-i="${i}" data-k="${k}"><span class="mk"></span><span class="lb"><span class="lt">${esc(t.label)}</span>${t.cat ? `<small class="${rc}">${s.g === 1 ? "MS/Publisher" : "Elder"}</small>` : ""}</span><span class="dots"></span><b class="nm">${s.name ? esc(s.name) + (s.over ? `<span class="ovr" title="Rule override">${ic("alert")}</span>` : "") : ic("alert") + " Needs someone"}</b></button>`;
        });
        const sp = supportOf(m);
        h += `<div class="ln sp${reveal ? " rv" : ""}" style="--d:${n * 35}ms"><span class="mk"></span><span class="lb"><span class="lt">Support</span></span><span class="dots"></span><span class="nm sm">${sp.length ? esc(sp.join(", ")) : "none"}</span></div>
 ${review(m, i)}<div class="acts"><button class="pri" data-a="copy" data-i="${i}">${copied === i ? ic("check") + "Copied" : ic("copy") + "Copy"}</button><button data-a="save" data-i="${i}"${isSaved(i) ? ' aria-pressed="true"' : ""}>${isSaved(i) ? ic("check") + "Saved" : ic("save") + "Save"}</button><button data-a="reroll" data-i="${i}">${ic("gen")}${i < S.meetings.length - 1 ? "Re-roll this + next" : "Re-roll this one"}</button></div>`;
        return h;
      }
      function vGen() {
        if (!S.members.length)
          return `<div class="em"><h2>No members yet</h2><p>Add your people first, then choose who can do each task.</p><button class="pri" data-a="tab" data-v="mem">${ic("plus")}Add members</button></div>`;
        let h = `<div class="top"><button class="pri${busy ? " ld" : ""}" data-a="gen"${busy ? " disabled" : ""}>${busy ? "Generating" : ic("gen") + "Generate both"}</button></div><div class="mts">`;
        S.meetings.forEach((m, i) => {
          const d = dt(m.date);
          h += `<section class="mt"><div class="ctl"><div class="date"><div class="dd"><b>${MON[d.getMonth()]} ${d.getDate()}</b><span>${WD[d.getDay()]}</span></div><input type="date" aria-label="Date" value="${m.date}" data-f="date" data-i="${i}"></div>
  <label>Heading in the copied text<input value="${esc(m.head)}" data-f="head" data-i="${i}"></label>
  <h3>Not available</h3><p class="hint">Has another task, or is absent.</p>
  <div class="chips">${m.un.map((p) => `<button class="chip" data-a="rmun" data-i="${i}" data-p="${esc(p)}" aria-label="Remove ${esc(p)}">${esc(p)}${ic("x")}</button>`).join("")}
  <select data-f="unadd" data-i="${i}" aria-label="Add unavailable person"><option value="">Add person</option>${S.members
    .filter((p) => !m.un.includes(p))
    .map((p) => `<option>${esc(p)}</option>`)
    .join("")}</select></div></div>
  <div class="ros">${busy ? sk() : m.slots ? roster(m, i) : `<div class="em sm"><p>No roster yet. Press Generate both.</p></div>`}</div></section>`;
        });
        return h + "</div>";
      }
      function vMem() {
        return `<h2>Members</h2><section class="blk"><label for="nm" style="margin-top:0">Add members, one name per line</label><textarea id="nm" placeholder="Heron D.&#10;Anthony G."></textarea><p><button class="pri" data-a="addmem">${ic("plus")}Add</button></p></section>
 <section class="blk"><h3>${S.members.length} members</h3>${S.members.length ? S.members.map((p) => `<div class="mr"><input value="${esc(p)}" aria-label="Member name" data-f="ren" data-p="${esc(p)}"><button class="dng ix" data-a="rmmem" data-p="${esc(p)}" aria-label="Remove ${esc(p)}">${ic("trash")}</button></div>`).join("") : `<div class="em sm"><p>No members yet. Paste names above.</p><button data-a="focus" data-id="nm">${ic("plus")}Add members</button></div>`}</section>`;
      }
      function vTask() {
        return (
          `<h2>Tasks</h2>` +
          S.tasks
            .map(
              (
                t,
                x,
              ) => `<section class="blk"><div class="tr"><input value="${esc(t.label)}" aria-label="Task name" data-f="tlabel" data-t="${x}">${t.cat ? "" : `<label class="n" style="margin:0">Slots<input type="number" min="1" max="9" value="${t.n}" data-f="tn" data-t="${x}"></label>`}</div>
 <div class="tools"><button class="ix" data-a="tup" data-t="${x}" aria-label="Move up">${ic("up")}</button><button class="ix" data-a="tdown" data-t="${x}" aria-label="Move down">${ic("down")}</button>${t.cat ? "" : `<button data-a="eall" data-t="${x}">All</button>`}<button data-a="enone" data-t="${x}">Clear</button><button class="${t.cat ? "pri" : ""}" data-a="tcat" data-t="${x}" aria-pressed="${!!t.cat}">1 Elder + 1 MS/Publisher</button><button class="dng ix" data-a="tdel" data-t="${x}" aria-label="Delete task">${ic("trash")}</button></div>
 <p class="hint">${t.cat ? `Tap a name to cycle: Elder, then MS/Publisher, then none. (${t.ok.length} Elders, ${t.ok2.length} MS/Publishers)` : `Who can do this (${t.ok.length})`}</p>
 <div class="chips">${
   S.members
     .map((p) => {
       const c = t.ok.includes(p) ? 1 : t.ok2.includes(p) ? 2 : 0;
       return t.cat
         ? `<button class="chip${c === 1 ? " e" : c === 2 ? " m" : ""}" data-a="cyc" data-t="${x}" data-p="${esc(p)}">${esc(p)}${c === 1 ? " · Elder" : c === 2 ? " · MS/Pub" : ""}</button>`
         : `<button class="chip${c ? " e" : ""}" data-a="elig" data-t="${x}" data-p="${esc(p)}">${esc(p)}</button>`;
     })
     .join("") || '<span class="hint">Add members first.</span>'
 }</div></section>`,
            )
            .join("") +
          `<section class="blk"><div class="tr"><input id="ntask" placeholder="New task name" aria-label="New task name"><button class="pri" data-a="addtask">${ic("plus")}Add task</button></div></section>`
        );
      }
      function vHist() {
        return (
          `<h2>History</h2><section class="blk"><h3>Add a past meeting</h3><p class="hint">Paste last meeting's message so the app knows who did what. Lines like "Audio: Ronald C."</p><input type="date" id="hdate" aria-label="Date" value="${iso(new Date())}"><label style="margin-top:12px" for="htxt">Message</label><textarea id="htxt"></textarea><p><button class="pri" data-a="hadd">Save past meeting</button></p></section>` +
          (S.history.length
            ? S.history
                .map(
                  (h) =>
                    `<section class="blk"><div class="hr"><h3>${esc(h.head || h.date)}</h3><button class="dng ix" data-a="hdel" data-d="${h.date}" aria-label="Delete meeting">${ic("trash")}</button></div><pre>${h.slots.map((s) => esc((task(s.taskId) || { label: "?" }).label) + ": " + esc(s.name)).join("\n")}</pre></section>`,
                )
                .join("")
            : `<div class="em"><h3>No meetings saved yet</h3><p>Press Save on a roster to keep it here. You can also paste a past one above.</p><button data-a="focus" data-id="htxt">Paste a past meeting</button></div>`) +
          `<section class="blk"><h3>Backup</h3><p class="hint">Data lives only in this browser. Use backup to move it to another device.</p><div class="top"><button data-a="export">Download backup</button><input type="file" accept=".json" aria-label="Restore backup" data-f="imp"></div></section>`
        );
      }
      function vSet() {
        const seg = (key, o) =>
          `<div class="seg" role="group">${o.map(([v, l]) => `<button data-a="ui" data-key="${key}" data-val="${v}" aria-pressed="${U[key] === v}">${l}</button>`).join("")}</div>`;
        return `<h2>Settings</h2><section class="blk"><h3>Palette</h3><div class="sws">${[
          ["cobalt", "Cobalt"],
          ["pine", "Pine"],
          ["rose", "Rose"],
        ]
          .map(
            ([v, l]) =>
              `<button class="sw" data-theme="${v}" data-a="ui" data-key="theme" data-val="${v}" aria-pressed="${U.theme === v}"><span class="pv"><i></i><b>Ronald C.</b><i class="a"></i></span><span>${l}</span></button>`,
          )
          .join("")}</div></section>
 <section class="blk"><h3>Appearance</h3><p class="hint">Auto follows your device.</p>${seg(
   "mode",
   [
     ["auto", "Auto"],
     ["light", "Light"],
     ["dark", "Dark"],
   ],
 )}</section>
 <section class="blk"><h3>Layout</h3><p class="hint">Bold has heavier type and thicker lines. Clean is lighter.</p>${seg(
   "layout",
   [
     ["bold", "Bold"],
     ["clean", "Clean"],
   ],
 )}</section>`;
      }
      function vPick() {
        if (!P) return "";
        const m = S.meetings[P.i],
          s = m.slots[P.k],
          t = task(s.taskId);
        const rows = S.members
          .filter((p) => p !== s.name)
          .map((p) => [p, why(P.i, P.k, p)])
          .sort((a, b) => (a[1] ? 1 : 0) - (b[1] ? 1 : 0));
        return `<div class="ov" data-a="closepick"><div class="sheet" role="dialog" aria-label="Change assignment"><h3>${esc(lab(t, s))}</h3><small>${s.name ? "Now: " + esc(s.name) : "Empty slot"}</small>
 <button class="pri" data-a="rand">${ic("gen")}Random replacement</button>${s.name ? `<button data-a="absent">${esc(s.name)} is absent. Replace.</button><button data-a="clear">Leave empty</button>` : ""}
 <h3 style="margin-top:8px;font-size:15px">Or choose someone</h3><div class="list">${rows.map(([p, r]) => `<button class="${r ? "bad" : ""}" data-a="choose" data-p="${esc(p)}">${esc(p)}${r ? ` <small>(${r})</small>` : ""}</button>`).join("")}</div><button data-a="closepick">Close</button></div></div>`;
      }
      function render() {
        $("app").innerHTML =
          { gen: vGen, mem: vMem, task: vTask, hist: vHist, set: vSet }[tab]() +
          vPick();
        document.querySelectorAll("#tabs [data-a=tab],.gear").forEach((b) => {
          const on = b.dataset.v === tab;
          b.classList.toggle("on", on);
          on
            ? b.setAttribute("aria-current", "page")
            : b.removeAttribute("aria-current");
        });
        save();
      }

      document.addEventListener("click", (e) => {
        const b = e.target.closest("[data-a]");
        if (!b) return;
        if (b.classList.contains("ov") && e.target !== b) return;
        const a = b.dataset.a,
          i = +b.dataset.i,
          k = +b.dataset.k,
          x = +b.dataset.t,
          p = b.dataset.p;
        if (a === "tab") {
          tab = b.dataset.v;
          P = null;
          scrollTo(0, 0);
        } else if (a === "ui") {
          U[b.dataset.key] = b.dataset.val;
          applyUI();
        } else if (a === "focus") {
          $(b.dataset.id).focus();
          return;
        } else if (a === "save") {
          saveHist(i);
          save();
          toast("Saved to History");
        } else if (a === "rvv") {
          rvView[i] = b.dataset.val;
        } else if (a === "gen") {
          run(0);
          return;
        } else if (a === "reroll") {
          run(i);
          return;
        } else if (a === "copy") {
          copy(i);
          return;
        } else if (a === "rmun")
          S.meetings[i].un = S.meetings[i].un.filter((y) => y !== p);
        else if (a === "pick") P = { i, k };
        else if (a === "closepick") P = null;
        else if (a === "rand") {
          replace(P.i, P.k, false);
          P = null;
        } else if (a === "absent") {
          const m = S.meetings[P.i];
          m.un.push(m.slots[P.k].name);
          replace(P.i, P.k, true);
          P = null;
        } else if (a === "clear") {
          const s = S.meetings[P.i].slots[P.k];
          s.name = null;
          s.over = false;
          P = null;
        } else if (a === "choose") {
          const m = S.meetings[P.i],
            s = m.slots[P.k],
            r = why(P.i, P.k, p);
          m.slots.forEach((y) => {
            if (y.name === p) y.name = null;
          });
          s.name = p;
          s.over = !!r;
          P = null;
        } else if (a === "addmem") {
          addMembers($("nm").value);
        } else if (a === "rmmem") {
          if (!confirm("Remove " + p + "?")) return;
          S.members = S.members.filter((y) => y !== p);
          S.tasks.forEach((t) => {
            t.ok = t.ok.filter((y) => y !== p);
            t.ok2 = t.ok2.filter((y) => y !== p);
          });
          S.meetings.forEach((m) => (m.un = m.un.filter((y) => y !== p)));
        } else if (a === "elig") {
          const t = S.tasks[x];
          t.ok = t.ok.includes(p)
            ? t.ok.filter((y) => y !== p)
            : t.ok.concat(p);
        } else if (a === "cyc") {
          const t = S.tasks[x],
            c = t.ok.includes(p) ? 1 : t.ok2.includes(p) ? 2 : 0;
          t.ok = t.ok.filter((y) => y !== p);
          t.ok2 = t.ok2.filter((y) => y !== p);
          if (c === 0) t.ok.push(p);
          else if (c === 1) t.ok2.push(p);
        } else if (a === "tcat") {
          const t = S.tasks[x];
          if (
            t.ok.length + t.ok2.length &&
            !confirm(
              "This clears the current list of who can do this task. Continue?",
            )
          )
            return;
          t.cat = !t.cat;
          t.ok = [];
          t.ok2 = [];
        } else if (a === "eall") S.tasks[x].ok = S.members.slice();
        else if (a === "enone") {
          S.tasks[x].ok = [];
          S.tasks[x].ok2 = [];
        } else if (a === "tup" && x > 0)
          [S.tasks[x - 1], S.tasks[x]] = [S.tasks[x], S.tasks[x - 1]];
        else if (a === "tdown" && x < S.tasks.length - 1)
          [S.tasks[x + 1], S.tasks[x]] = [S.tasks[x], S.tasks[x + 1]];
        else if (a === "tdel") {
          if (!confirm("Delete this task?")) return;
          S.tasks.splice(x, 1);
        } else if (a === "addtask") {
          const v = $("ntask").value.trim();
          if (v)
            S.tasks.push({
              id: "t" + Date.now(),
              label: v,
              n: 1,
              ok: [],
              ok2: [],
              cat: false,
            });
        } else if (a === "hdel")
          S.history = S.history.filter((h) => h.date !== b.dataset.d);
        else if (a === "hadd") {
          const r = parsePaste($("htxt").value),
            d = $("hdate").value;
          if (!d || !r.slots.length) {
            alert('Pick a date and paste lines like "Audio: Ronald C."');
            return;
          }
          S.history = S.history.filter((h) => h.date !== d);
          S.history.push({ date: d, head: hd(d), slots: r.slots });
          S.history.sort((u, v) => (u.date < v.date ? 1 : -1));
          alert(
            "Saved " +
              r.slots.length +
              " assignments." +
              (r.bad.length
                ? "\n\nNot recognised (task name does not match):\n" +
                  r.bad.join("\n")
                : ""),
          );
        } else if (a === "export") {
          const u = URL.createObjectURL(
              new Blob([JSON.stringify(S)], { type: "application/json" }),
            ),
            l = document.createElement("a");
          l.href = u;
          l.download = "assignment-maker-backup.json";
          l.click();
          return;
        }
        render();
      });
      document.addEventListener("change", (e) => {
        const f = e.target.dataset.f;
        if (!f) return;
        const v = e.target.value,
          i = +e.target.dataset.i,
          x = +e.target.dataset.t;
        if (f === "date" && v) {
          const m = S.meetings[i];
          m.date = v;
          if (!m.edited) m.head = hd(v);
        } else if (f === "head") {
          S.meetings[i].head = v;
          S.meetings[i].edited = true;
        } else if (f === "unadd") {
          if (v) S.meetings[i].un.push(v);
        } else if (f === "ren") rename(e.target.dataset.p, v);
        else if (f === "tlabel") {
          if (v.trim()) S.tasks[x].label = v.trim();
        } else if (f === "tn") S.tasks[x].n = Math.max(1, Math.min(9, +v || 1));
        else if (f === "imp") {
          const r = new FileReader();
          r.onload = () => {
            try {
              const o = JSON.parse(r.result);
              if (!o.members || !o.tasks) throw 0;
              S = o;
              render();
              toast("Backup restored");
            } catch (_) {
              alert("That file is not a valid backup.");
            }
          };
          r.readAsText(e.target.files[0]);
          return;
        }
        render();
      });
      render();
    </script>
  </body>
</html>
